<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FestReel | College Fest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="badge">🎉 COLLEGE FEST</div>
      <h1>🎲 FestReel</h1>
      <p>Scan. Discover. Enjoy.</p>
    </header>

    <section class="card">
      <div class="sparkle">✨</div>
      <div class="small">YOUR RANDOM COLLEGE MOMENT</div>
      <p id="quote" class="quote" aria-live="polite"></p>
      <div id="category" class="category">💬 QUOTE</div>
    </section>

    <button id="another" type="button">🎲 Get Another</button>
    <p class="hint">Every scan gives you a random moment.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
